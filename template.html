<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff6600'/%3E%3Ctext x='8' y='12.5' font-family='Verdana' font-size='11' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f6ef; --page: #f6f6ef; --bar: #ff6600; --bar-ink: #000; --ink: #000; --sub: #828282;
  --link-visited: #828282; --rule: #ff6600; --comment-bg: #efefe6; --mark: #ff6600; --input: #fff; --line: #dcdcd0;
  --font: Verdana, Geneva, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a18; --page: #1a1a18; --bar: #e05a00; --bar-ink: #111; --ink: #e8e6df; --sub: #9a978d;
    --link-visited: #8a877e; --rule: #e05a00; --comment-bg: #23231f; --mark: #ff8a3d; --input: #26261f; --line: #34342d;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a18; --page: #1a1a18; --bar: #e05a00; --bar-ink: #111; --ink: #e8e6df; --sub: #9a978d;
  --link-visited: #8a877e; --rule: #e05a00; --comment-bg: #23231f; --mark: #ff8a3d; --input: #26261f; --line: #34342d;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.35 var(--font); }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 1px; }
.wrap { max-width: 1080px; margin: 8px auto 40px; background: var(--page); }

/* top bar */
header { background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; gap: 4px 10px;
  padding: 3px 6px; flex-wrap: wrap; }
.logo { display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1px solid #fff;
  color: #fff; font-weight: bold; font-size: 12px; flex: none; }
.brand { font-weight: bold; margin-right: 4px; white-space: nowrap; }
nav { display: flex; flex-wrap: wrap; align-items: center; row-gap: 2px; }
nav a { white-space: nowrap; }
nav a[aria-current="page"] { color: #fff; }
nav .sep { padding: 0 4px; }
.right { margin-left: auto; font-size: 12px; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
.right button { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }

/* list */
.intro { color: var(--sub); font-size: 12px; padding: 10px 10px 2px 38px; }
.intro b { color: var(--ink); font-weight: normal; }
.daynav { padding: 10px 10px 2px 38px; font-size: 12px; color: var(--sub); }
.daynav b { color: var(--ink); }
.daynav a { color: var(--ink); }
ol.stories { list-style: none; margin: 0; padding: 8px 10px 0 0; }
ol.stories > li { display: grid; grid-template-columns: 32px 1fr; padding: 0 0 7px; }
.n { color: var(--sub); text-align: right; padding-right: 6px; }
.title { font-size: 13.5px; }
.title a.t:visited { color: var(--link-visited); }
.title .d { color: var(--sub); font-size: 11px; margin-left: 3px; }
.title .d:hover { text-decoration: underline; }
.badge { font-size: 10px; color: var(--mark); border: 1px solid currentColor; border-radius: 2px; padding: 0 3px;
  margin-left: 5px; vertical-align: 1px; white-space: nowrap; }
.sub { color: var(--sub); font-size: 11px; margin-top: 1px; }
.sub a:hover { text-decoration: underline; }
.sub .pipe { padding: 0 3px; }
.sub .hot { color: var(--ink); }
.sub button.discuss { font: inherit; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.sub button.discuss:hover { text-decoration: underline; }
.comments { margin: 6px 0 4px; padding: 6px 10px; background: var(--comment-bg); border-left: 2px solid var(--line);
  font-size: 12px; max-width: 760px; }
.comments[hidden] { display: none; }
.comments .c { margin: 0 0 8px; }
.comments .c:last-child { margin-bottom: 0; }
.comments .who { color: var(--sub); font-size: 11px; }
.comments p { margin: 2px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
.more { padding: 4px 0 12px 38px; }
.more a { color: var(--ink); }
.empty { padding: 24px 38px; color: var(--sub); }

/* footer */
footer { border-top: 2px solid var(--rule); margin: 18px 0 0; padding: 12px 10px; text-align: center; font-size: 11.5px;
  color: var(--sub); }
footer label { color: var(--sub); }
footer input { font: inherit; font-size: 12px; background: var(--input); color: var(--ink); border: 1px solid var(--line);
  padding: 2px 4px; width: 220px; max-width: 70vw; }
footer .health { margin-top: 10px; line-height: 1.6; }
footer .bad { color: #c2410c; }
footer details { margin-top: 6px; display: inline-block; text-align: left; }
footer summary { cursor: pointer; text-align: center; list-style: none; }
footer summary::-webkit-details-marker { display: none; }
footer summary:hover { text-decoration: underline; }
footer table { border-collapse: collapse; margin-top: 6px; }
footer td { padding: 1px 8px; }
footer td.num { text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 750px) {
  .wrap { margin: 0; }
  header { padding: 6px 16px; }
  .right { margin-left: 0; width: 100%; }
  ol.stories { padding-right: 16px; }
  ol.stories > li { grid-template-columns: 36px 1fr; padding-bottom: 10px; }
  .title { font-size: 15px; }
  .sub { font-size: 12px; margin-top: 3px; }
  .intro, .daynav, .more, .empty { padding-left: 36px; padding-right: 16px; }
  footer { padding: 12px 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo" aria-hidden="true">A</span>
    <a class="brand" href="#top" id="brand">AI Daily</a>
    <nav id="nav" aria-label="Views"></nav>
    <span class="right"><span id="updated"></span><button id="theme" type="button" aria-label="Toggle dark mode">◐</button></span>
  </header>
  <main id="main"></main>
  <footer>
    <label>Search: <input id="q" type="search" autocomplete="off" placeholder="titles, sites, sources"></label>
    <div class="health" id="health"></div>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const PER_PAGE = 30;
const TOPIC_LABEL = { launches: "launches", llms: "llms", agents: "agents", research: "research", tools: "tools",
  open: "open source", industry: "industry", policy: "policy" };
const PLATFORM = { hn: "HN", reddit: "Reddit", lobsters: "Lobsters", hf_papers: "HF Papers", hf_models: "HF",
  github: "GitHub", web: "web", gnews: "news" };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const stories = DATA.stories.map((s) => ({ ...s, t: new Date(s.published) }));
const generated = new Date(DATA.generated);

function ago(d) {
  const m = Math.max(1, Math.round((generated - d) / 60000));
  if (m < 60) return `${m} minute${m === 1 ? "" : "s"} ago`;
  const h = Math.round(m / 60);
  if (h < 36) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const days = Math.round(h / 24);
  return `${days} day${days === 1 ? "" : "s"} ago`;
}
const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayLabel = (k) => new Date(k + "T12:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

/* One subline entry per platform the story showed up on. */
function viaBits(s) {
  const seen = new Set();
  const bits = [];
  for (const v of s.via) {
    const key = v.platform === "web" || v.platform === "gnews" ? "src:" + v.source : v.platform + ":" + (v.source || "");
    if (seen.has(key)) continue;
    seen.add(key);
    const href = v.discussion_url || v.url;
    let label;
    switch (v.platform) {
      case "hn": label = `<span class="hot">${v.score ?? 0} points</span> on HN · ${v.comments ?? 0} comments`; break;
      case "reddit": label = `#${(v.rank ?? 0) + 1} today on ${esc(v.source)}`; break;
      case "lobsters": label = `${v.score ?? 0} on Lobsters · ${v.comments ?? 0} comments`; break;
      case "hf_papers": label = `${v.score ?? 0} upvotes on HF Papers`; break;
      case "hf_models": label = `♥ ${v.score ?? 0} on Hugging Face`; break;
      case "github": label = `★ ${v.score ?? 0} on GitHub`; break;
      default: label = esc(v.source);
    }
    bits.push(`<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`);
  }
  const extra = bits.length - 4;
  return extra > 0 ? [...bits.slice(0, 4), `<span title="${esc(s.via.slice(4).map((v) => v.source).join(", "))}">+${extra} more</span>`] : bits;
}

function row(s, n) {
  const pipe = '<span class="pipe">|</span>';
  const tags = s.tags.map((t) => `<a href="#t/${t}">${esc(TOPIC_LABEL[t] || t)}</a>`).join(", ");
  const sub = [
    viaBits(s).join(pipe),
    `<span title="${esc(s.t.toLocaleString())}">${ago(s.t)}</span>`,
    tags,
    s.comments.length ? `<button type="button" class="discuss" aria-expanded="false" data-id="${s.id}">discuss (${s.comments.length})</button>` : "",
  ].filter(Boolean).join(pipe);
  const comments = s.comments.length ? `<div class="comments" id="c-${s.id}" hidden>${s.comments.map((c) => `
      <div class="c"><div class="who">${esc(c.author || "anon")} on <a href="${esc(c.thread)}" target="_blank" rel="noopener">${PLATFORM[c.platform] || c.platform}</a>${c.published ? " · " + ago(new Date(c.published)) : ""}</div>
      <p>${esc(c.text)}</p></div>`).join("")}</div>` : "";
  return `<li><span class="n">${n}.</span><div>
    <div class="title"><a class="t" href="${esc(s.url)}" target="_blank" rel="noopener"${s.text ? ` title="${esc(s.text)}"` : ""}>${esc(s.title)}</a>${s.domain ? ` <a class="d" href="#site/${esc(s.domain)}">(${esc(s.domain)})</a>` : ""}${s.official ? '<span class="badge">official</span>' : ""}</div>
    <div class="sub">${sub}</div>${comments}</div></li>`;
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "top";
  const [view, arg, page] = h.split("/");
  return { view, arg, page: Math.max(1, parseInt(view === "top" || view === "new" ? arg : page, 10) || 1) };
}

function navHTML(r) {
  const items = [["new", "new"], ["past", "past"], ...DATA.topics.map((t) => ["t/" + t, TOPIC_LABEL[t] || t])];
  return items.map(([href, label]) => {
    const cur = (href === r.view) || (r.view === "t" && href === "t/" + r.arg);
    return `<a href="#${href}"${cur ? ' aria-current="page"' : ""}>${esc(label)}</a>`;
  }).join('<span class="sep">|</span>');
}

function render() {
  const r = route();
  const q = $("#q").value.trim().toLowerCase();
  $("#nav").innerHTML = navHTML(r);
  $("#brand").toggleAttribute("aria-current", r.view === "top");
  let list = stories, intro = "", base = r.view;
  const days = [...new Set(stories.map((s) => dayKey(s.t)))].sort().reverse();

  if (r.view === "new") {
    list = [...stories].sort((a, b) => b.t - a.t);
    intro = "Newest first, across every platform.";
  } else if (r.view === "past") {
    const day = days.includes(r.arg) ? r.arg : days[1] || days[0];
    const i = days.indexOf(day);
    list = stories.filter((s) => dayKey(s.t) === day).sort((a, b) => b.heat - a.heat);
    intro =
      (days[i + 1] ? `<a href="#past/${days[i + 1]}">« ${esc(dayLabel(days[i + 1]))}</a> · ` : "") +
      `Stories from <b>${esc(dayLabel(day))}</b>, ranked by how far they spread` +
      (i > 0 ? ` · <a href="#past/${days[i - 1]}">${esc(dayLabel(days[i - 1]))} »</a>` : "");
    base = "past/" + day;
  } else if (r.view === "t") {
    list = stories.filter((s) => s.tags.includes(r.arg));
    intro = `Top stories tagged <b>${esc(TOPIC_LABEL[r.arg] || r.arg)}</b>.`;
    base = "t/" + r.arg;
  } else if (r.view === "site") {
    list = [...stories].filter((s) => s.domain === r.arg).sort((a, b) => b.t - a.t);
    intro = `Stories from <b>${esc(r.arg)}</b>.`;
    base = "site/" + r.arg;
  } else {
    intro = esc(DATA.tagline) + ".";
  }
  if (q) {
    list = list.filter((s) => (s.title + " " + s.domain + " " + s.via.map((v) => v.source).join(" ")).toLowerCase().includes(q));
    intro = `${list.length} match${list.length === 1 ? "" : "es"} for <b>${esc(q)}</b>.`;
  }
  const start = (r.page - 1) * PER_PAGE;
  const pageList = list.slice(start, start + PER_PAGE);
  const moreHref = `#${base}/${r.page + 1}`;
  $("#main").innerHTML =
    `<div class="${r.view === "past" && !q ? "daynav" : "intro"}">${intro}</div>` +
    (pageList.length ? `<ol class="stories">${pageList.map((s, i) => row(s, start + i + 1)).join("")}</ol>`
      : `<div class="empty">Nothing here yet.</div>`) +
    (list.length > start + PER_PAGE ? `<div class="more"><a href="${moreHref}">More</a></div>` : "");
  document.title = r.view === "top" && !q ? DATA.title : `${DATA.title} · ${r.view === "t" ? TOPIC_LABEL[r.arg] || r.arg : r.view}`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button.discuss");
  if (!b) return;
  const box = document.getElementById("c-" + b.dataset.id);
  box.hidden = !box.hidden;
  b.setAttribute("aria-expanded", String(!box.hidden));
});
$("#q").addEventListener("input", render);
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

/* theme: follows the OS unless toggled; the choice is remembered per browser */
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("ai-daily-theme")); } catch (_) {}
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("ai-daily-theme", t); } catch (_) {}
});

$("#updated").textContent = "updated " + generated.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
{
  const h = DATA.health || [];
  const bad = h.filter((x) => x.status !== "ok");
  $("#health").innerHTML = `<details><summary>${h.length - bad.length} of ${h.length} sources ok` +
    (bad.length ? ` · <span class="bad">failed: ${bad.map((x) => esc(x.name)).join(", ")}</span>` : "") +
    ` · ${stories.length} stories</summary><table>${h.map((x) =>
      `<tr><td>${esc(x.name)}</td><td class="num">${x.items}</td><td>${x.status === "ok" ? "ok" : `<span class="bad" title="${esc(x.error)}">error</span>`}</td></tr>`).join("")}</table></details>`;
}
render();
</script>
</body>
</html>
