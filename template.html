<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff6600'/%3E%3Ctext x='8' y='12.5' font-family='Verdana' font-size='11' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f6ef; --page: #f6f6ef; --bar: #ff6600; --bar-ink: #000; --ink: #000; --sub: #828282;
  --link-visited: #828282; --rule: #ff6600; --comment-bg: #efefe6; --mark: #ff6600; --input: #fff; --line: #dcdcd0;
  --font: Verdana, Geneva, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a18; --page: #1a1a18; --bar: #e05a00; --bar-ink: #111; --ink: #e8e6df; --sub: #9a978d;
    --link-visited: #8a877e; --rule: #e05a00; --comment-bg: #23231f; --mark: #ff8a3d; --input: #26261f; --line: #34342d;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a18; --page: #1a1a18; --bar: #e05a00; --bar-ink: #111; --ink: #e8e6df; --sub: #9a978d;
  --link-visited: #8a877e; --rule: #e05a00; --comment-bg: #23231f; --mark: #ff8a3d; --input: #26261f; --line: #34342d;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.35 var(--font); }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 1px; }
.wrap { max-width: 1080px; margin: 8px auto 40px; background: var(--page); }

/* top bar */
header { background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; gap: 4px 10px;
  padding: 3px 6px; flex-wrap: wrap; }
.logo { display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1px solid #fff;
  color: #fff; font-weight: bold; font-size: 12px; flex: none; }
.brand { font-weight: bold; margin-right: 4px; white-space: nowrap; }
nav { display: flex; flex-wrap: wrap; align-items: center; row-gap: 2px; }
nav a { white-space: nowrap; }
nav a[aria-current="page"] { color: #fff; }
nav .sep { padding: 0 4px; }
.right { margin-left: auto; font-size: 12px; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
.right button { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }

/* list */
.intro { color: var(--sub); font-size: 12px; padding: 10px 10px 2px 38px; }
.intro b { color: var(--ink); font-weight: normal; }
.daynav { padding: 10px 10px 2px 38px; font-size: 12px; color: var(--sub); }
.daynav b { color: var(--ink); }
.daynav a { color: var(--ink); }
ol.stories { list-style: none; margin: 0; padding: 8px 10px 0 0; }
ol.stories > li { display: grid; grid-template-columns: 32px 1fr; padding: 0 0 7px; }
.n { color: var(--sub); text-align: right; padding-right: 6px; }
.title { font-size: 13.5px; }
.title a.t:visited { color: var(--link-visited); }
.title .d { color: var(--sub); font-size: 11px; margin-left: 3px; }
.title .d:hover { text-decoration: underline; }
.badge { font-size: 10px; color: var(--mark); border: 1px solid currentColor; border-radius: 2px; padding: 0 3px;
  margin-left: 5px; vertical-align: 1px; white-space: nowrap; }
.sub { color: var(--sub); font-size: 11px; margin-top: 1px; }
.sub a:hover { text-decoration: underline; }
.sub .pipe { padding: 0 3px; }
.sub .hot { color: var(--ink); }
.comments { margin: 6px 0 4px; padding: 6px 10px; background: var(--comment-bg); border-left: 2px solid var(--line);
  font-size: 12px; max-width: 760px; }
.comments[hidden] { display: none; }
.comments .c { margin: 0 0 8px; }
.comments .c:last-child { margin-bottom: 0; }
.comments .who { color: var(--sub); font-size: 11px; }
.comments p { margin: 2px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
.more { padding: 4px 0 12px 38px; }
.more a { color: var(--ink); }
.empty { padding: 24px 38px; color: var(--sub); }

/* footer */
footer { border-top: 2px solid var(--rule); margin: 18px 0 0; padding: 12px 10px; text-align: center; font-size: 11.5px;
  color: var(--sub); }
footer label { color: var(--sub); }
footer input { font: inherit; font-size: 12px; background: var(--input); color: var(--ink); border: 1px solid var(--line);
  padding: 2px 4px; width: 220px; max-width: 70vw; }
footer .health { margin-top: 10px; line-height: 1.6; }
footer .bad { color: #c2410c; }
footer details { margin-top: 6px; display: inline-block; text-align: left; }
footer summary { cursor: pointer; text-align: center; list-style: none; }
footer summary::-webkit-details-marker { display: none; }
footer summary:hover { text-decoration: underline; }
footer table { border-collapse: collapse; margin-top: 6px; }
footer td { padding: 1px 8px; }
footer td.num { text-align: right; font-variant-numeric: tabular-nums; }

.linkish { font: inherit; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.linkish:hover { text-decoration: underline; }
.sub .save.on { color: var(--mark); }
nav a.mine { font-style: italic; }
nav .mine-sep { padding: 0 6px; opacity: .6; }
.matches { margin-top: 4px; }
.intro code, .daynav code { font-size: 11.5px; }
.pinform { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--sub); }
.pinform[hidden] { display: none; }
.pinform input { font: inherit; font-size: 12px; background: var(--input); color: var(--ink); border: 1px solid var(--line); padding: 2px 4px; width: 14em; max-width: 60vw; }
.pinform button[type=submit] { font: inherit; font-size: 12px; }
footer .note { margin-top: 6px; }

@media (max-width: 750px) {
  .wrap { margin: 0; }
  header { padding: 6px 16px; }
  .right { margin-left: 0; width: 100%; }
  ol.stories { padding-right: 16px; }
  ol.stories > li { grid-template-columns: 36px 1fr; padding-bottom: 10px; }
  .title { font-size: 15px; }
  .sub { font-size: 12px; margin-top: 3px; }
  .intro, .daynav, .more, .empty { padding-left: 36px; padding-right: 16px; }
  footer { padding: 12px 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo" aria-hidden="true">A</span>
    <a class="brand" href="#top" id="brand">AI Daily</a>
    <nav id="nav" aria-label="Views"></nav>
    <span class="right"><span id="updated"></span><button id="theme" type="button" aria-label="Toggle dark mode">◐</button></span>
  </header>
  <main id="main"></main>
  <footer>
    <label>Search: <input id="q" type="search" autocomplete="off" placeholder="words, &quot;phrases&quot;, a|b   ( / )"></label>
    <div class="note" id="note"></div>
    <div class="health" id="health"></div>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const PER_PAGE = 30;
const TOPIC_LABEL = { launches: "launches", llms: "llms", agents: "agents", research: "research", tools: "tools",
  open: "open source", industry: "industry", policy: "policy" };
const PLATFORM = { hn: "HN", reddit: "Reddit", lobsters: "Lobsters", hf_papers: "HF Papers", hf_models: "HF",
  github: "GitHub", web: "web", gnews: "news" };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const stories = DATA.stories.map((s) => ({ ...s, t: new Date(s.published) }));
const byId = new Map(stories.map((s) => [s.id, s]));
const generated = new Date(DATA.generated);

/* ---------- your saved stories and pinned topics
   Synced through the VM server (server.py) when the page is served by it; otherwise kept in this browser. */
const LOCAL_KEY = "ai-daily-user";
const user = { saved: {}, topics: [], mode: "local", error: "" };

async function loadUser() {
  if (location.protocol.startsWith("http")) {
    try {
      const r = await fetch("api/state", { cache: "no-store" });
      if (r.ok) { Object.assign(user, await r.json(), { mode: "server" }); return; }
    } catch (_) { /* no server: fall back to this browser */ }
  }
  try { Object.assign(user, JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}")); } catch (_) {}
  user.mode = "local";
}

async function send(method, path, body) {
  if (user.mode !== "server") {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ saved: user.saved, topics: user.topics })); } catch (_) {}
    return true;
  }
  try {
    const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
    user.error = "";
    return true;
  } catch (e) {
    user.error = "Couldn't save to the server (" + e.message + "). Nothing was changed.";
    return false;
  }
}

const snapshot = ({ t, comments, rank, ...rest }) => rest;

async function toggleSave(id) {
  const prev = user.saved[id];
  if (prev) {
    delete user.saved[id];
    render();
    if (!(await send("POST", "api/unsave", { id }))) user.saved[id] = prev;
  } else {
    const s = byId.get(id);
    if (!s) return;
    user.saved[id] = { ...snapshot(s), saved_at: new Date().toISOString() };
    render();
    if (!(await send("POST", "api/save", snapshot(s)))) delete user.saved[id];
  }
  render();
}

async function setTopics(next) {
  const prev = user.topics;
  user.topics = next;
  render();
  if (!(await send("PUT", "api/topics", next))) { user.topics = prev; render(); }
}

const slug = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "topic";

/* ---------- search: words must all match (at a word start), "quoted phrases" match exactly, a|b matches either */
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function matcher(q) {
  const tokens = (q || "").toLowerCase().match(/(?:"[^"]*"|[^\s"])+/g) || [];
  const terms = tokens.map((tok) => (tok.match(/(?:"[^"]*"|[^|"])+/g) || [])
    .map((a) => a.replace(/"/g, "").trim()).filter(Boolean)).filter((alts) => alts.length);
  if (!terms.length) return null;
  const res = terms.map((alts) => new RegExp("(?:^|[^a-z0-9])(?:" + alts.map(escRe).join("|") + ")"));
  return (s) => res.every((re) => re.test(haystack(s)));
}
const hay = new WeakMap();
function haystack(s) {
  if (!hay.has(s)) {
    hay.set(s, [s.title, s.text, s.domain, (s.tags || []).join(" "), (s.via || []).map((v) => v.source).join(" ")]
      .join(" \n ").toLowerCase());
  }
  return hay.get(s);
}

/* ---------- routes: #<view>[/<arg>][/q/<search>][/p/<page>] */
const VIEWS_WITH_ARG = new Set(["past", "t", "u", "site"]);
function route() {
  const parts = (location.hash.slice(1) || "top").split("/").map((p) => { try { return decodeURIComponent(p); } catch (_) { return p; } });
  if (parts[0] === "q" || parts[0] === "p") parts.unshift("top");  // #q/mcp = the front page, searched
  const r = { view: parts[0] || "top", arg: "", q: "", page: 1 };
  let i = 1;
  if (VIEWS_WITH_ARG.has(r.view) && parts[i] !== undefined && parts[i] !== "q" && parts[i] !== "p") r.arg = parts[i++];
  while (i < parts.length) {
    if (parts[i] === "q") { r.q = parts[i + 1] || ""; i += 2; }
    else if (parts[i] === "p") { r.page = Math.max(1, parseInt(parts[i + 1], 10) || 1); i += 2; }
    else i++;
  }
  return r;
}
function link(r, over = {}) {
  const x = { ...r, ...over };
  let h = "#" + x.view + (x.arg ? "/" + encodeURIComponent(x.arg) : "");
  if (x.q) h += "/q/" + encodeURIComponent(x.q);
  if (x.page > 1) h += "/p/" + x.page;
  return h;
}

function ago(d) {
  const m = Math.max(1, Math.round((generated - d) / 60000));
  if (m < 60) return `${m} minute${m === 1 ? "" : "s"} ago`;
  const h = Math.round(m / 60);
  if (h < 36) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const days = Math.round(h / 24);
  return `${days} day${days === 1 ? "" : "s"} ago`;
}
const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayLabel = (k) => new Date(k + "T12:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

/* One subline entry per platform the story showed up on. */
function viaBits(s) {
  const seen = new Set();
  const bits = [];
  for (const v of s.via || []) {
    const key = v.platform === "web" || v.platform === "gnews" ? "src:" + v.source : v.platform + ":" + (v.source || "");
    if (seen.has(key)) continue;
    seen.add(key);
    const href = v.discussion_url || v.url;
    let label;
    switch (v.platform) {
      case "hn": label = `<span class="hot">${v.score ?? 0} points</span> on HN · ${v.comments ?? 0} comments`; break;
      case "reddit": label = `#${(v.rank ?? 0) + 1} today on ${esc(v.source)}`; break;
      case "lobsters": label = `${v.score ?? 0} on Lobsters · ${v.comments ?? 0} comments`; break;
      case "hf_papers": label = `${v.score ?? 0} upvotes on HF Papers`; break;
      case "hf_models": label = `♥ ${v.score ?? 0} on Hugging Face`; break;
      case "github": label = `★ ${v.score ?? 0} on GitHub`; break;
      default: label = esc(v.source);
    }
    bits.push(`<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`);
  }
  const extra = bits.length - 4;
  return extra > 0 ? [...bits.slice(0, 4), `<span title="${esc(s.via.slice(4).map((v) => v.source).join(", "))}">+${extra} more</span>`] : bits;
}

function row(s, n) {
  const pipe = '<span class="pipe">|</span>';
  const tags = (s.tags || []).map((t) => `<a href="#t/${t}">${esc(TOPIC_LABEL[t] || t)}</a>`).join(", ");
  const saved = Boolean(user.saved[s.id]);
  const comments = s.comments || [];
  const sub = [
    viaBits(s).join(pipe),
    `<span title="${esc(s.t.toLocaleString())}">${ago(s.t)}</span>`,
    tags,
    comments.length ? `<button type="button" class="linkish discuss" aria-expanded="false" data-id="${s.id}">discuss (${comments.length})</button>` : "",
    `<button type="button" class="linkish save${saved ? " on" : ""}" aria-pressed="${saved}" data-save="${s.id}">${saved ? "saved ★" : "save"}</button>`,
  ].filter(Boolean).join(pipe);
  const box = comments.length ? `<div class="comments" id="c-${s.id}" hidden>${comments.map((c) => `
      <div class="c"><div class="who">${esc(c.author || "anon")} on <a href="${esc(c.thread)}" target="_blank" rel="noopener">${PLATFORM[c.platform] || c.platform}</a>${c.published ? " · " + ago(new Date(c.published)) : ""}</div>
      <p>${esc(c.text)}</p></div>`).join("")}</div>` : "";
  return `<li><span class="n">${n}.</span><div>
    <div class="title"><a class="t" href="${esc(s.url)}" target="_blank" rel="noopener"${s.text ? ` title="${esc(s.text)}"` : ""}>${esc(s.title)}</a>${s.domain ? ` <a class="d" href="#site/${esc(s.domain)}">(${esc(s.domain)})</a>` : ""}${s.official ? '<span class="badge">official</span>' : ""}</div>
    <div class="sub">${sub}</div>${box}</div></li>`;
}

function navHTML(r) {
  const nSaved = Object.keys(user.saved).length;
  const items = [["new", "new"], ["past", "past"], ["saved", nSaved ? `saved (${nSaved})` : "saved"],
    ...DATA.topics.map((t) => ["t/" + t, TOPIC_LABEL[t] || t])];
  const cur = r.view + (r.arg && (r.view === "t" || r.view === "u") ? "/" + r.arg : "");
  const html = items.map(([href, label]) => `<a href="#${href}"${cur === href ? ' aria-current="page"' : ""}>${esc(label)}</a>`);
  const mine = user.topics.map((t) => {
    const href = "u/" + slug(t.name);
    return `<a class="mine" href="#${href}" title="${esc(t.query)}"${cur === href ? ' aria-current="page"' : ""}>${esc(t.name)}</a>`;
  });
  return html.join('<span class="sep">|</span>') + (mine.length ? '<span class="sep mine-sep">||</span>' + mine.join('<span class="sep">|</span>') : "");
}

function render() {
  const r = route();
  $("#nav").innerHTML = navHTML(r);
  $("#brand").toggleAttribute("aria-current", r.view === "top");
  if (document.activeElement !== $("#q")) $("#q").value = r.q;

  let list = stories, intro = "", introClass = "intro";
  const days = [...new Set(stories.map((s) => dayKey(s.t)))].sort().reverse();
  const topic = r.view === "u" ? user.topics.find((t) => slug(t.name) === r.arg) : null;

  if (r.view === "new") {
    list = [...stories].sort((a, b) => b.t - a.t);
    intro = "Newest first, across every platform.";
  } else if (r.view === "past") {
    const day = days.includes(r.arg) ? r.arg : days[1] || days[0];
    const i = days.indexOf(day);
    r.arg = day;
    list = stories.filter((s) => dayKey(s.t) === day).sort((a, b) => b.heat - a.heat);
    introClass = "daynav";
    intro = (days[i + 1] ? `<a href="${link(r, { arg: days[i + 1], page: 1 })}">« ${esc(dayLabel(days[i + 1]))}</a> · ` : "") +
      `Stories from <b>${esc(dayLabel(day))}</b>, ranked by how far they spread` +
      (i > 0 ? ` · <a href="${link(r, { arg: days[i - 1], page: 1 })}">${esc(dayLabel(days[i - 1]))} »</a>` : "");
  } else if (r.view === "saved") {
    list = Object.values(user.saved).sort((a, b) => String(b.saved_at).localeCompare(String(a.saved_at)))
      .map((snap) => byId.get(snap.id) || { ...snap, t: new Date(snap.published), comments: [] });
    intro = list.length ? "Stories you saved, newest save first. They stay here after they drop off the front page."
      : "Nothing saved yet. Use <b>save</b> under any story.";
  } else if (r.view === "t") {
    list = stories.filter((s) => s.tags.includes(r.arg));
    intro = `Top stories tagged <b>${esc(TOPIC_LABEL[r.arg] || r.arg)}</b>.`;
  } else if (r.view === "u") {
    if (topic) {
      const m = matcher(topic.query);
      list = m ? stories.filter(m) : [];
      intro = `Your topic <b>${esc(topic.name)}</b>: stories matching <code>${esc(topic.query)}</code>. ` +
        `<button type="button" class="linkish" id="edit-topic">edit</button> · <button type="button" class="linkish" id="unpin">unpin</button>`;
    } else {
      list = [];
      intro = "That pinned topic doesn't exist (any more).";
    }
  } else if (r.view === "site") {
    list = stories.filter((s) => s.domain === r.arg).sort((a, b) => b.t - a.t);
    intro = `Stories from <b>${esc(r.arg)}</b>.`;
  } else {
    intro = esc(DATA.tagline) + ".";
  }

  const m = matcher(r.q);
  if (m) {
    list = list.filter(m);
    const pinned = user.topics.some((t) => t.query.toLowerCase() === r.q.toLowerCase());
    intro += `<div class="matches">${list.length} match${list.length === 1 ? "" : "es"} for <b>${esc(r.q)}</b>` +
      (r.view === "top" ? "" : " in this view") +
      (pinned ? " · pinned" : ` · <button type="button" class="linkish" id="pin">pin as topic</button>`) +
      ` · <a href="${link(r, { q: "", page: 1 })}">clear</a></div>`;
  }
  intro += `<form class="pinform" id="pinform" hidden><label>Topic name <input name="tname" maxlength="40" required></label>
    <label>matches <input name="tquery" maxlength="200" required></label> <button type="submit">pin</button>
    <button type="button" class="linkish" id="pin-cancel">cancel</button></form>`;

  const start = (r.page - 1) * PER_PAGE;
  const pageList = list.slice(start, start + PER_PAGE);
  $("#main").innerHTML =
    `<div class="${introClass}">${intro}</div>` +
    (pageList.length ? `<ol class="stories">${pageList.map((s, i) => row(s, start + i + 1)).join("")}</ol>`
      : `<div class="empty">${r.q ? "No stories match." : "Nothing here yet."}</div>`) +
    (list.length > start + PER_PAGE ? `<div class="more"><a href="${link(r, { page: r.page + 1 })}">More</a></div>` : "");
  document.title = r.view === "top" && !r.q ? DATA.title
    : `${DATA.title} · ${topic ? topic.name : r.view === "t" ? TOPIC_LABEL[r.arg] || r.arg : r.view}${r.q ? " · " + r.q : ""}`;
  $("#note").innerHTML = user.error ? `<span class="bad">${esc(user.error)}</span>`
    : user.mode === "local" ? "Saved stories and pinned topics are kept in this browser only (the page isn't being served by the AI Daily server)." : "";
}

function openPinForm(name, query) {
  const f = $("#pinform");
  f.hidden = false;
  f.elements.tname.value = name;
  f.elements.tquery.value = query;
  f.elements.tname.focus();
  f.elements.tname.select();
}

document.addEventListener("click", (e) => {
  const d = e.target.closest("button.discuss");
  if (d) {
    const box = document.getElementById("c-" + d.dataset.id);
    box.hidden = !box.hidden;
    d.setAttribute("aria-expanded", String(!box.hidden));
    return;
  }
  const s = e.target.closest("button[data-save]");
  if (s) { toggleSave(s.dataset.save); return; }
  const r = route();
  if (e.target.id === "pin") openPinForm(r.q.replace(/["|]/g, " ").trim().slice(0, 40), r.q);
  if (e.target.id === "pin-cancel") $("#pinform").hidden = true;
  const topic = user.topics.find((t) => slug(t.name) === r.arg);
  if (e.target.id === "edit-topic" && topic) openPinForm(topic.name, topic.query);
  if (e.target.id === "unpin" && topic) {
    setTopics(user.topics.filter((t) => t !== topic));
    location.hash = "#top";
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "pinform") return;
  e.preventDefault();
  const name = e.target.elements.tname.value.trim().slice(0, 40), query = e.target.elements.tquery.value.trim().slice(0, 200);
  if (!name || !query) return;
  const r = route();
  const editing = r.view === "u" ? user.topics.find((t) => slug(t.name) === r.arg) : null;
  const next = user.topics.filter((t) => t !== editing && slug(t.name) !== slug(name));
  next.push({ name, query });
  setTopics(next);
  location.hash = "#u/" + encodeURIComponent(slug(name));
});

$("#q").addEventListener("input", () => {
  history.replaceState(null, "", link(route(), { q: $("#q").value.trim(), page: 1 }));
  render();
});
addEventListener("keydown", (e) => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    $("#q").focus();
  }
});
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

/* theme: follows the OS unless toggled; the choice is remembered per browser */
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("ai-daily-theme")); } catch (_) {}
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("ai-daily-theme", t); } catch (_) {}
});

$("#updated").textContent = "updated " + generated.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
{
  const h = DATA.health || [];
  const bad = h.filter((x) => x.status !== "ok");
  $("#health").innerHTML = `<details><summary>${h.length - bad.length} of ${h.length} sources ok` +
    (bad.length ? ` · <span class="bad">failed: ${bad.map((x) => esc(x.name)).join(", ")}</span>` : "") +
    ` · ${stories.length} stories</summary><table>${h.map((x) =>
      `<tr><td>${esc(x.name)}</td><td class="num">${x.items}</td><td>${x.status === "ok" ? "ok" : `<span class="bad" title="${esc(x.error)}">error</span>`}</td></tr>`).join("")}</table></details>`;
}
render();
loadUser().then(render);
// Pick up saves made on another device whenever this tab comes back into view.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && user.mode === "server") loadUser().then(render);
});
</script>
</body>
